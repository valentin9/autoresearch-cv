[project]
name = "autoresearch"
version = "0.2.0"
description = "Autonomous vision research swarm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "Pillow>=11.0.0",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "timm>=1.0.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "datasets>=3.0.0",
]

[tool.uv.sources]
# On Linux/Windows with NVIDIA GPU: pulls CUDA 12.8 wheel
# On macOS: uv ignores this (no matching marker) and uses the standard PyPI wheel (MPS support built in)
torch = [
    { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
